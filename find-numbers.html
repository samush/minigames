<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Найди числа</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; background: #0d1220; color: #e8ecf5;
    font-family: system-ui, sans-serif; touch-action: manipulation;
  }
  header {
    width: 100%; max-width: 640px; display: flex; align-items: center;
    justify-content: space-between; padding: 12px 16px; box-sizing: border-box;
  }
  header a { color: #7ea2ff; text-decoration: none; font-size: .9rem; }
  #timer { font-size: 1.6rem; font-variant-numeric: tabular-nums; font-weight: 600; }
  #target { font-size: 1.1rem; color: #9aa7c0; }
  #target b { color: #5dd39e; font-size: 1.4rem; }
  canvas { max-width: 100%; border-radius: 16px; background: #0a0e1a; cursor: pointer; }
  .controls {
    display: flex; gap: 16px; align-items: center; padding: 14px;
    flex-wrap: wrap; justify-content: center;
  }
  button {
    font: inherit; padding: 10px 28px; border-radius: 10px; border: none;
    background: #4f7cff; color: #fff; cursor: pointer; font-weight: 600;
  }
  button:hover { background: #3f68e0; }
  label { font-size: .9rem; color: #9aa7c0; display: flex; gap: 8px; align-items: center; }
  #overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(13,18,32,.85); flex-direction: column; gap: 16px; text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay .msg { font-size: 1.6rem; font-weight: 600; }
</style>
</head>
<body>
  <header>
    <a href="index.html">&larr; Все игры</a>
    <div id="target">Ищи: <b>1</b></div>
    <div id="timer">1:00</div>
  </header>
  <canvas id="c"></canvas>
  <div class="controls">
    <button id="start">Старт</button>
    <label>Скорость
      <input type="range" id="speed" min="0.2" max="2.5" step="0.1" value="1">
    </label>
  </div>
  <div id="overlay"><div class="msg"></div><button id="again">Ещё раз</button></div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const timerEl = document.getElementById('timer');
const targetEl = document.getElementById('target').querySelector('b');
const overlay = document.getElementById('overlay');
const msgEl = overlay.querySelector('.msg');
const speedInput = document.getElementById('speed');

const RING_COUNTS = [6, 9, 12, 13];          // numbers per ring, inner to outer
const ROUND_SECONDS = 60;
const SIZE = Math.min(640, window.innerWidth - 16, window.innerHeight - 170);
canvas.width = canvas.height = SIZE * devicePixelRatio;
canvas.style.width = canvas.style.height = SIZE + 'px';
ctx.scale(devicePixelRatio, devicePixelRatio);

let rings = [];        // {radius, dir, speed, offset, flipAt, items:[{n, angle, found}]}
let running = false;
let target = 1;
let endsAt = 0;
let lastT = 0;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function setupRound() {
  const nums = shuffle(Array.from({length: 40}, (_, i) => i + 1));
  const maxR = SIZE / 2 - 28;
  rings = RING_COUNTS.map((count, i) => {
    const radius = maxR * (0.3 + 0.7 * i / (RING_COUNTS.length - 1));
    return {
      radius,
      dir: Math.random() < 0.5 ? 1 : -1,
      // base angular speed in rad/s; outer rings slightly slower so linear speed stays sane
      speed: 0.25 + Math.random() * 0.15,
      offset: Math.random() * Math.PI * 2,
      flipAt: performance.now() + 5000 + Math.random() * 3000,
      items: nums.splice(0, count).map((n, k) => ({
        n, angle: (k / count) * Math.PI * 2, found: false
      }))
    };
  });
  target = 1;
  targetEl.textContent = '1';
}

function itemPos(ring, item) {
  const a = item.angle + ring.offset;
  return {
    x: SIZE / 2 + ring.radius * Math.cos(a),
    y: SIZE / 2 + ring.radius * Math.sin(a)
  };
}

function draw() {
  ctx.clearRect(0, 0, SIZE, SIZE);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '600 ' + Math.round(SIZE / 24) + 'px system-ui, sans-serif';
  for (const ring of rings) {
    for (const item of ring.items) {
      const p = itemPos(ring, item);
      ctx.fillStyle = item.found ? '#2c3a2f' : '#e8ecf5';
      ctx.fillText(item.n, p.x, p.y);
    }
  }
}

function frame(t) {
  if (running) {
    const dt = Math.min((t - lastT) / 1000, 0.1);
    const mult = parseFloat(speedInput.value);
    for (const ring of rings) {
      if (t >= ring.flipAt) {
        ring.dir *= -1;
        ring.flipAt = t + 5000 + Math.random() * 3000;
      }
      ring.offset += ring.dir * ring.speed * mult * dt;
    }
    const left = Math.max(0, (endsAt - t) / 1000);
    timerEl.textContent = Math.floor(left / 60) + ':' + String(Math.ceil(left % 60) % 60).padStart(2, '0');
    if (left <= 0) finish(false);
  }
  lastT = t;
  draw();
  requestAnimationFrame(frame);
}

function finish(won) {
  running = false;
  msgEl.textContent = won
    ? 'Все 40 найдены! 🎉'
    : 'Время вышло. Дошёл до ' + (target - 1) + ' из 40.';
  overlay.classList.add('show');
}

function startRound() {
  overlay.classList.remove('show');
  setupRound();
  endsAt = performance.now() + ROUND_SECONDS * 1000;
  running = true;
}

canvas.addEventListener('pointerdown', e => {
  if (!running) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const hitR = SIZE / 24 + 8;
  for (const ring of rings) {
    for (const item of ring.items) {
      if (item.found || item.n !== target) continue;
      const p = itemPos(ring, item);
      if ((p.x - x) ** 2 + (p.y - y) ** 2 < hitR ** 2) {
        item.found = true;
        target++;
        if (target > 40) finish(true);
        else targetEl.textContent = target;
      }
    }
  }
});

document.getElementById('start').addEventListener('click', startRound);
document.getElementById('again').addEventListener('click', startRound);

setupRound();
requestAnimationFrame(frame);
</script>
</body>
</html>
