<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Найди числа</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; background: #0d1220; color: #e8ecf5;
    font-family: system-ui, sans-serif; touch-action: manipulation;
  }
  header {
    width: 100%; max-width: 640px; display: flex; align-items: center;
    justify-content: space-between; padding: 12px 16px; box-sizing: border-box;
  }
  header a { color: #7ea2ff; text-decoration: none; font-size: .9rem; }
  #timer { font-size: 1.6rem; font-variant-numeric: tabular-nums; font-weight: 600; }
  #target { font-size: 1.1rem; color: #9aa7c0; }
  #target b { color: #5dd39e; font-size: 1.4rem; }
  canvas { max-width: 100%; border-radius: 16px; background: #0a0e1a; cursor: pointer; }
  .controls {
    display: flex; gap: 16px; align-items: center; padding: 14px;
    flex-wrap: wrap; justify-content: center;
  }
  button {
    font: inherit; padding: 10px 28px; border-radius: 10px; border: none;
    background: #4f7cff; color: #fff; cursor: pointer; font-weight: 600;
  }
  button:hover { background: #3f68e0; }
  label { font-size: .9rem; color: #9aa7c0; display: flex; gap: 8px; align-items: center; }
  #overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(13,18,32,.85); flex-direction: column; gap: 16px; text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay .msg { font-size: 1.6rem; font-weight: 600; }
  #overlay .stats { font-size: 1.1rem; color: #9aa7c0; line-height: 1.6; }
  #overlay .stats b { color: #e8ecf5; }
  details.settings {
    width: 100%; max-width: 420px; box-sizing: border-box;
    margin: 4px 16px 24px; padding: 12px 16px;
    background: #171f33; border: 1px solid #2a3a55; border-radius: 12px;
  }
  details.settings summary { cursor: pointer; color: #7ea2ff; font-size: .95rem; }
  details.settings label { margin-top: 12px; }
  select { font: inherit; background: #0d1220; color: #e8ecf5; border: 1px solid #2a3a55; border-radius: 8px; padding: 4px 8px; }
</style>
</head>
<body>
  <header>
    <a href="index.html">&larr; Все игры</a>
    <div id="target">Ищи: <b>1</b></div>
    <div id="timer">1:00</div>
  </header>
  <canvas id="c"></canvas>
  <div class="controls">
    <button id="start">Старт</button>
    <label>Скорость
      <input type="range" id="speed" min="0.2" max="2.5" step="0.1" value="1">
    </label>
  </div>
  <details class="settings">
    <summary>Настройки</summary>
    <label><input type="checkbox" id="dimFound" checked> Гасить найденные числа</label>
    <label>Эффект при нажатии
      <select id="effect">
        <option value="none">нет</option>
        <option value="ring" selected>да</option>
        <option value="joke">шутка</option>
      </select>
    </label>
    <label>Режим игры
      <select id="mode">
        <option value="standard" selected>стандарт</option>
        <option value="strict">одна ошибка</option>
        <option value="adaptive">адаптивный</option>
      </select>
    </label>
    <label>Траектория
      <select id="traj">
        <option value="rings" selected>кольца</option>
        <option value="chaos">хаос</option>
      </select>
    </label>
  </details>
  <div id="overlay"><div class="msg"></div><div class="stats"></div><button id="again">Ещё раз</button></div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const timerEl = document.getElementById('timer');
const targetEl = document.getElementById('target').querySelector('b');
const overlay = document.getElementById('overlay');
const msgEl = overlay.querySelector('.msg');
const statsEl = overlay.querySelector('.stats');
const speedInput = document.getElementById('speed');
const dimFound = document.getElementById('dimFound');
const effectSel = document.getElementById('effect');
const modeSel = document.getElementById('mode');
const trajSel = document.getElementById('traj');

const INSULTS = ['Лох!', 'Чмо!', 'Хрен!', 'Мозила!', 'Пипка!'];

const RING_COUNTS = [6, 9, 12, 13];          // numbers per ring, inner to outer
const ROUND_SECONDS = 60;
const SIZE = Math.min(640, window.innerWidth - 16, window.innerHeight - 170);
canvas.width = canvas.height = SIZE * devicePixelRatio;
canvas.style.width = canvas.style.height = SIZE + 'px';
ctx.scale(devicePixelRatio, devicePixelRatio);

let rings = [];        // {radius, dir, speed, offset, flipAt, items:[{n, angle, found}]}
let running = false;
let chaos = false;      // trajectory captured at round start
let target = 1;
let errors = 0;
let effects = [];   // {x, y, ok, t0, mode}
let endsAt = 0;
let lastT = 0;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function setupRound() {
  const nums = shuffle(Array.from({length: 40}, (_, i) => i + 1));
  const maxR = SIZE / 2 - 28;
  rings = RING_COUNTS.map((count, i) => {
    const radius = maxR * (0.3 + 0.7 * i / (RING_COUNTS.length - 1));
    return {
      radius,
      dir: Math.random() < 0.5 ? 1 : -1,
      // base angular speed in rad/s; outer rings slightly slower so linear speed stays sane
      speed: 0.25 + Math.random() * 0.15,
      offset: Math.random() * Math.PI * 2,
      flipAt: performance.now() + 5000 + Math.random() * 3000,
      items: nums.splice(0, count).map((n, k) => ({
        n, angle: (k / count) * Math.PI * 2, found: false
      }))
    };
  });
  target = 1;
  errors = 0;
  effects = [];
  targetEl.textContent = '1';
  chaos = trajSel.value === 'chaos';
  if (chaos) {
    for (const ring of rings) {
      for (const item of ring.items) {
        const p = itemPos(ring, item);
        item.x = p.x; item.y = p.y;
        item.h = Math.random() * Math.PI * 2;        // heading
        item.v = 25 + Math.random() * 20;            // px/s before multiplier
      }
    }
  }
}

function speedMult() {
  // adaptive: ramps with each found number; slider ignored
  return modeSel.value === 'adaptive'
    ? 0.4 + (target - 1) * 0.13
    : parseFloat(speedInput.value);
}

function itemPos(ring, item) {
  if (chaos && item.x !== undefined) return {x: item.x, y: item.y};
  const a = item.angle + ring.offset;
  return {
    x: SIZE / 2 + ring.radius * Math.cos(a),
    y: SIZE / 2 + ring.radius * Math.sin(a)
  };
}

function draw() {
  ctx.clearRect(0, 0, SIZE, SIZE);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '600 ' + Math.round(SIZE / 24) + 'px system-ui, sans-serif';
  for (const ring of rings) {
    for (const item of ring.items) {
      const p = itemPos(ring, item);
      ctx.fillStyle = item.found && dimFound.checked ? '#2c3a2f' : '#e8ecf5';
      ctx.fillText(item.n, p.x, p.y);
    }
  }
  drawEffects();
}

const EFFECT_MS = 700;
function addEffect(x, y, ok) {
  if (effectSel.value === 'none') return;
  effects.push({
    x, y, ok, t0: performance.now(), mode: effectSel.value,
    text: ok ? 'Ок!' : INSULTS[Math.floor(Math.random() * INSULTS.length)]
  });
}

function drawEffects() {
  const now = performance.now();
  effects = effects.filter(f => now - f.t0 < EFFECT_MS);
  for (const f of effects) {
    const k = (now - f.t0) / EFFECT_MS;   // 0 → 1
    ctx.globalAlpha = 1 - k;
    if (f.mode === 'ring') {
      ctx.strokeStyle = f.ok ? '#5dd39e' : '#ff6b6b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(f.x, f.y, 10 + k * 30, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.fillStyle = f.ok ? '#5dd39e' : '#ff6b6b';
      ctx.font = '700 ' + Math.round(SIZE / 14) + 'px "Comic Sans MS", "Comic Neue", cursive';
      ctx.fillText(f.text, f.x, f.y - 14 - k * 24);
      ctx.font = '600 ' + Math.round(SIZE / 24) + 'px system-ui, sans-serif';
    }
    ctx.globalAlpha = 1;
  }
}

function frame(t) {
  if (running) {
    const dt = Math.min((t - lastT) / 1000, 0.1);
    const mult = speedMult();
    if (chaos) {
      const cx = SIZE / 2, maxR = SIZE / 2 - 28, r = SIZE / 28;
      const all = rings.flatMap(ring => ring.items);
      for (const item of all) {
        item.h += (Math.random() - 0.5) * 1.2 * dt;   // slight gas-particle wander
        item.x += Math.cos(item.h) * item.v * mult * dt;
        item.y += Math.sin(item.h) * item.v * mult * dt;
        // bounce off circular boundary: reflect heading about the outward normal
        const dx = item.x - cx, dy = item.y - cx;
        const dist = Math.hypot(dx, dy);
        if (dist > maxR) {
          const nx = dx / dist, ny = dy / dist;
          const vx = Math.cos(item.h), vy = Math.sin(item.h);
          const dot = vx * nx + vy * ny;
          if (dot > 0) item.h = Math.atan2(vy - 2 * dot * ny, vx - 2 * dot * nx);
          item.x = cx + nx * maxR;
          item.y = cx + ny * maxR;
        }
      }
      // ponytail: O(n^2) pair check, fine for 40 items
      for (let i = 0; i < all.length; i++) {
        for (let j = i + 1; j < all.length; j++) {
          const a = all[i], b = all[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          const d = Math.hypot(dx, dy);
          if (d < 2 * r && d > 0.001) {
            const push = (2 * r - d) / 2;
            const nx = dx / d, ny = dy / d;
            a.x -= nx * push; a.y -= ny * push;
            b.x += nx * push; b.y += ny * push;
            a.h = Math.atan2(-ny, -nx) + (Math.random() - 0.5) * 0.3;
            b.h = Math.atan2(ny, nx) + (Math.random() - 0.5) * 0.3;
          }
        }
      }
    } else {
      for (const ring of rings) {
        if (t >= ring.flipAt) {
          ring.dir *= -1;
          ring.flipAt = t + 5000 + Math.random() * 3000;
        }
        ring.offset += ring.dir * ring.speed * mult * dt;
      }
    }
    const left = Math.max(0, (endsAt - t) / 1000);
    timerEl.textContent = Math.floor(left / 60) + ':' + String(Math.ceil(left % 60) % 60).padStart(2, '0');
    if (left <= 0) finish(false);
  }
  lastT = t;
  draw();
  requestAnimationFrame(frame);
}

function rating(n) {
  return n < 10 ? 'малыш' : n < 15 ? 'додик' : n < 20 ? 'первоклашка'
    : n < 25 ? 'нормис' : n < 30 ? 'крутяк' : n < 35 ? 'могуч' : 'папаня';
}

function finish(won) {
  running = false;
  const found = target - 1;
  msgEl.textContent = won ? 'Все 40 найдены! 🎉' : 'Время вышло.';
  statsEl.innerHTML = 'Нашёл: <b>' + found + '</b> из 40<br>'
    + 'Ошибок: <b>' + errors + '</b><br>'
    + 'Оценка: <b>' + rating(found) + '</b>';
  overlay.classList.add('show');
}

function startRound() {
  overlay.classList.remove('show');
  setupRound();
  endsAt = performance.now() + ROUND_SECONDS * 1000;
  running = true;
}

canvas.addEventListener('pointerdown', e => {
  if (!running) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const hitR = SIZE / 24 + 8;
  let best = null, bestD = hitR ** 2;
  for (const ring of rings) {
    for (const item of ring.items) {
      if (item.found) continue;
      const p = itemPos(ring, item);
      const d = (p.x - x) ** 2 + (p.y - y) ** 2;
      if (d < bestD) { best = item; bestD = d; }
    }
  }
  if (!best) return;
  if (best.n === target) {
    best.found = true;
    addEffect(x, y, true);
    target++;
    if (target > 40) finish(true);
    else targetEl.textContent = target;
  } else {
    errors++;
    addEffect(x, y, false);
    if (modeSel.value === 'strict') finish(false);
  }
});

document.getElementById('start').addEventListener('click', startRound);
document.getElementById('again').addEventListener('click', startRound);

setupRound();
requestAnimationFrame(frame);
</script>
</body>
</html>
